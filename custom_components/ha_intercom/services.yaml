nachricht_loeschen:
  name: Delete message
  description: Deletes a mailbox entry including its clip and thumbnail.
  fields:
    kennung:
      name: ID
      description: ID of the entry, e.g. 2026-09-06_14-32-10
      required: true
      example: 2026-09-06_14-32-10
      selector:
        text: null
nachricht_gesehen:
  name: Mark message as seen
  description: Marks a mailbox entry as seen.
  fields:
    kennung:
      name: ID
      description: ID of the entry, e.g. 2026-09-06_14-32-10
      required: true
      selector:
        text: null
alle_gesehen:
  name: Mark all messages as seen
  description: Marks all mailbox entries as seen.
ansage_aktivieren:
  name: Activate announcement
  description: Makes the named announcement the active one.
  fields:
    name:
      name: Name
      description: Name of the announcement
      required: true
      example: Standard
      selector:
        text: null
ansage_loeschen:
  name: Delete announcement
  description: Deletes an announcement file.
  fields:
    name:
      name: Name
      description: Name of the announcement
      required: true
      selector:
        text: null
ansage_umbenennen:
  name: Rename announcement
  description: Renames an announcement.
  fields:
    name:
      name: Name
      description: Name of the announcement
      required: true
      selector:
        text: null
    neuer_name:
      name: New name
      description: New name of the announcement
      required: true
      selector:
        text: null
aufnahme_starten:
  name: Start recording
  description: Starts a manual recording of the door station stream.
aufnahme_stoppen:
  name: Stop recording
  description: Stops the running recording.
index_neu:
  name: Rescan folders
  description: Reads the mailbox, announcement, ringback and ringtone folders again.
asterisk_sync:
  name: Sync Asterisk
  description: Writes all settings into the Asterisk database again.
